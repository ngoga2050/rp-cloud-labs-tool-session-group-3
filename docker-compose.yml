services:

  # Flask API
  api:
    build: ./api
    container_name: rp-cloud-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://rpuser:rppassword@database:5432/rpcloud
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - rp-cloud-network

  # PostgreSQL database
  database:
    image: postgres:16
    container_name: rp-cloud-database
    environment:
      POSTGRES_USER: rpuser
      POSTGRES_PASSWORD: rppassword
      POSTGRES_DB: rpcloud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rpuser -d rpcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rp-cloud-network

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: rp-cloud-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rp-cloud-network

  # Kafka message broker using KRaft
  kafka:
    image: apache/kafka:3.9.1
    container_name: rp-cloud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - rp-cloud-network

# Shared network
networks:
  rp-cloud-network:
    driver: bridge

# Persistent database storage
volumes:
  postgres-data:
